<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#ffffff" />
    <!-- Theme before first paint: the sidebar toggle's choice (ns-theme-v2, the
         old app's key), light by default. -->
    <script>(function(){try{var v=localStorage.getItem('ns-theme-v2');if(v==='system')v=matchMedia('(prefers-color-scheme: dark)').matches?'dark':'light';if(v!=='dark')v='light';document.documentElement.setAttribute('data-theme',v);document.documentElement.style.colorScheme=v;}catch(e){document.documentElement.setAttribute('data-theme','light');}})();</script>
    <link rel="icon" href="/nanologo-76.png" type="image/png" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <!-- The server replaces everything between the seo markers per route
         (title, description, canonical, Open Graph, JSON-LD). These defaults
         are what dev mode and unknown routes get. -->
    <!--seo:start-->
    <title>Nano Syllabus — learn your syllabus, one short lesson at a time</title>
    <meta name="description" content="Short video lessons and interactive explainers for IOE and Nepali university syllabi. Learn each subject topic by topic." />
    <meta property="og:site_name" content="Nano Syllabus" />
    <meta property="og:type" content="website" />
    <!--seo:end-->
  </head>
  <body>
    <!-- #root holds crawlable server HTML until React mounts over it. -->
    <div id="root"><!--ssr--></div>
    <!--data-->
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
